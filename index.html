<meta charset="utf-8">
<script>
/* 카카오톡·네이버·페이스북·인스타그램 등 인앱 브라우저에서 열리면 기본 브라우저로 다시 열기 */
(function () {
  var ua = navigator.userAgent || '';
  var url = location.href;
  /* Claude 미리보기처럼 다른 화면 안에 들어가 있거나, http(s) 주소가 아니면 건너뛰기 */
  try { if (window.self !== window.top) return; } catch (e) { return; }
  if (!/^https?:/i.test(url)) return;
  var inApp = /KAKAOTALK|NAVER\(inapp|FBAN|FBAV|FB_IAB|Instagram|Line\/|DaumApps|everytimeApp|wv\)/i.test(ua);
  if (/KAKAOTALK/i.test(ua)) { location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url); return; }
  if (/Line\//i.test(ua) && url.indexOf('openExternalBrowser=1') < 0) {
    location.href = url + (url.indexOf('?') < 0 ? '?' : '&') + 'openExternalBrowser=1'; return;
  }
  if (!inApp) return;
  if (/Android/i.test(ua)) {
    location.href = 'intent://' + url.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;end'; return;
  }
  document.addEventListener('DOMContentLoaded', function () {
    var box = document.createElement('div');
    box.setAttribute('role', 'dialog');
    box.style.cssText = 'position:fixed;inset:0;z-index:99;background:rgba(13,17,32,.94);color:#eef0f8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;font:15px/1.6 system-ui,sans-serif';
    box.innerHTML = '<strong style="font-size:18px">사파리에서 열어 주세요</strong>' +
      '<span>이 앱 안의 브라우저에서는 일부 기능이 제대로 작동하지 않을 수 있어요.<br>⋯ 메뉴에서 <b>Safari로 열기</b>를 눌러 주세요.</span>' +
      '<button id="copyUrl" style="font:inherit;padding:10px 18px;border-radius:999px;border:0;background:#eef0f8;color:#0d1120">주소 복사</button>' +
      '<button id="stayHere" style="font:inherit;background:none;border:0;color:#9aa3c0;text-decoration:underline">그냥 여기서 보기</button>';
    document.body.appendChild(box);
    document.getElementById('copyUrl').onclick = function () {
      var b = this;
      (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(
        function () { b.textContent = '복사했어요'; }, function () { b.textContent = url; });
    };
    document.getElementById('stayHere').onclick = function () { box.remove(); };
  });
})();
</script>
<title>우리 반 모형 시계</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* 한 화면 교구: 가운데 큰 시계, 아래 시각 상자, 설정은 서랍(넓은 화면에선 왼쪽 패널) */
:root {
  --bg: #e6eef7;          /* 교실 벽 같은 옅은 하늘 */
  --face: #ffffff;
  --rim: #24315c;         /* 시계 테두리·숫자 */
  --ink: #24315c;
  --muted: #6c7896;
  --hour: #e2483a;        /* 시침 = 빨강 */
  --minute: #2f6ad8;      /* 분침 = 파랑 */
  --second: #f2a516;
  --panel: #ffffff;
  --line: #cfd9e8;
  --f-display: "Jua", "Gowun Dodum", system-ui, sans-serif;
  --f-body: "Gowun Dodum", system-ui, sans-serif;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; overflow: hidden; margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
.app {
  height: 100%; display: grid;
  grid-template-columns: minmax(0,1fr); grid-template-rows: minmax(0,1fr) auto;
  padding-block: clamp(10px, 2.5vh, 28px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  gap: clamp(8px, 2vh, 22px);
  --boxh: clamp(64px, 13vh, 150px);
}
.stage { min-height: 0; min-width: 0; height: 100%; width: 100%; container-type: size; display: grid; place-items: center; }
.clock {
  width: min(100cqw, 100cqh);
  max-width: 100%; aspect-ratio: 1; touch-action: none; display: block;
}
.clock .hand { cursor: grab; transition: filter .15s; }
.clock .hand.grabbed { filter: drop-shadow(0 0 6px rgba(36,49,92,.45)); }
.clock.live .hand { cursor: default; }
.clock text { font-family: var(--f-display); fill: var(--rim); }
.clock .mins text { fill: var(--minute); }

.readout {
  justify-self: center; height: var(--boxh);
  display: flex; align-items: center; justify-content: center; gap: .35em;
  width: 6.4em; max-width: 100%; padding: 0 .6em; border-radius: 22px;
  background: var(--panel); border: 3px solid var(--rim);
  font-family: var(--f-display); font-size: min(calc(var(--boxh) * .56), 11vw);
  line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap;
}
.readout .h { color: var(--hour); }
.readout .m { color: var(--minute); }
.readout .s { color: var(--second); font-size: .7em; }
.readout span:empty { display: none; }
.readout.wide { width: 8.6em; }
.app.nobox .readout { display: none; }
.app.nobox { grid-template-rows: minmax(0,1fr) 0; }

/* 설정 */
.gear {
  position: fixed; z-index: 5;
  top: calc(env(safe-area-inset-top, 0px) + 12px);
  right: calc(env(safe-area-inset-right, 0px) + 12px);
  width: 56px; height: 56px; border-radius: 50%;
  border: 2px solid var(--line); background: var(--panel); color: var(--ink);
  display: grid; place-items: center; cursor: pointer;
}
.gear svg { width: 28px; height: 28px; }
.scrim { position: fixed; inset: 0; z-index: 6; background: rgba(36,49,92,.25); }
.panel {
  position: fixed; z-index: 7;
  top: calc(env(safe-area-inset-top, 0px) + 12px);
  right: calc(env(safe-area-inset-right, 0px) + 12px);
  width: min(300px, calc(100vw - 32px));
  background: var(--panel); border-radius: 20px; padding: 18px;
  box-shadow: 0 12px 40px rgba(36,49,92,.22);
  display: flex; flex-direction: column; gap: 6px;
}
.panel h2 { margin: 0 0 6px; font: 22px var(--f-display); color: var(--ink); }
.opt {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  min-height: 56px; font-size: 18px; cursor: pointer; border-top: 1px solid var(--line);
}
.opt:first-of-type { border-top: 0; }
.opt.sub { padding-left: 10px; font-size: 16px; color: var(--muted); border-top-style: dashed; }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.sw { flex: none; width: 54px; height: 32px; border-radius: 99px; background: var(--line); position: relative; transition: background .2s; }
.sw::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: var(--face); transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.opt input:checked + .sw { background: var(--minute); }
.opt input:checked + .sw::after { transform: translateX(22px); }
.opt input:focus-visible + .sw { outline: 3px solid var(--hour); outline-offset: 2px; }
.reset {
  margin-top: 8px; min-height: 52px; border-radius: 14px; border: 2px solid var(--line);
  background: var(--bg); color: var(--ink); font: 18px var(--f-display); cursor: pointer;
}
.reset:disabled { opacity: .4; cursor: default; }
.hint { margin: 4px 0 0; font-size: 14px; color: var(--muted); line-height: 1.5; }
.hint b.h { color: var(--hour); } .hint b.m { color: var(--minute); }

/* 가로로 넓은 화면(TV·전자칠판): 설정을 왼쪽 패널로 늘 펼침 */
@media (min-width: 1200px) and (min-aspect-ratio: 16/10) {
  .app { grid-template-columns: 300px minmax(0,1fr) 300px; grid-template-rows: minmax(0,1fr) auto; column-gap: 24px; }
  .stage { grid-column: 2; grid-row: 1; }
  .readout { grid-column: 2; grid-row: 2; }
  .panel {
    position: static; grid-column: 1; grid-row: 1 / span 2; align-self: center;
    width: auto; box-shadow: none; border: 2px solid var(--line);
  }
  .panel[hidden] { display: flex !important; }
  .gear, .scrim { display: none !important; }
}
@media (prefers-reduced-motion: reduce) { .sw, .sw::after { transition: none; } }
</style>

<div class="app" id="app">
  <div class="stage">
    <svg class="clock" id="clock" viewBox="0 0 400 400" aria-label="모형 시계" role="img">
      <g id="mins" class="mins" pointer-events="none" style="display:none"></g>
      <circle cx="200" cy="200" r="194" fill="#24315c"/>
      <circle cx="200" cy="200" r="182" fill="#ffffff"/>
      <g id="ticks"></g>
      <g id="nums"></g>
      <g class="hand" id="hourHand">
        <rect x="-10" y="-102" width="20" height="120" rx="10" fill="#e2483a"/>
      </g>
      <g class="hand" id="minHand">
        <rect x="-6.5" y="-152" width="13" height="170" rx="6.5" fill="#2f6ad8"/>
      </g>
      <g id="secHand" pointer-events="none">
        <rect x="-2" y="-162" width="4" height="190" rx="2" fill="#f2a516"/>
        <circle cx="0" cy="22" r="6" fill="#f2a516"/>
      </g>
      <circle cx="200" cy="200" r="13" fill="#24315c" pointer-events="none"/>
      <circle cx="200" cy="200" r="5" fill="#ffffff" pointer-events="none"/>
    </svg>
  </div>

  <div class="readout" id="readout" aria-live="polite"><span class="h" id="rh">3시</span><span class="m" id="rm"></span><span class="s" id="rs"></span></div>

  <button class="gear" id="gear" aria-label="설정 열기">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="9" cy="7" r="2.2" fill="#fff"/><circle cx="15" cy="12" r="2.2" fill="#fff"/><circle cx="8" cy="17" r="2.2" fill="#fff"/></svg>
  </button>
  <div class="scrim" id="scrim" hidden></div>
  <div class="panel" id="panel" hidden>
    <h2>시계 설정</h2>
    <label class="opt">5분 단위 숫자<input type="checkbox" id="optMin"><span class="sw"></span></label>
    <label class="opt">현재 시각<input type="checkbox" id="optLive"><span class="sw"></span></label>
    <label class="opt sub" id="secRow" hidden>└ 초침 보이기<input type="checkbox" id="optSec"><span class="sw"></span></label>
    <label class="opt">시각 상자<input type="checkbox" id="optBox" checked><span class="sw"></span></label>
    <button class="reset" id="reset">12시로 맞추기</button>
    <p class="hint"><b class="h">짧은 빨간 바늘</b>이 시침, <b class="m">긴 파란 바늘</b>이 분침이에요. 바늘을 잡고 돌려 보세요.</p>
  </div>
</div>

<script>
(function () {
  var NS = 'http://www.w3.org/2000/svg', C = 200;
  var svg = document.getElementById('clock');
  var hourHand = document.getElementById('hourHand');
  var minHand = document.getElementById('minHand');
  var secHand = document.getElementById('secHand');
  var app = document.getElementById('app');

  /* 눈금과 숫자 */
  var ticks = document.getElementById('ticks');
  for (var i = 0; i < 60; i++) {
    var five = i % 5 === 0, a = i * 6 * Math.PI / 180;
    var r1 = five ? 160 : 170, r2 = 180;
    var l = document.createElementNS(NS, 'line');
    l.setAttribute('x1', C + r1 * Math.sin(a)); l.setAttribute('y1', C - r1 * Math.cos(a));
    l.setAttribute('x2', C + r2 * Math.sin(a)); l.setAttribute('y2', C - r2 * Math.cos(a));
    l.setAttribute('stroke', '#24315c'); l.setAttribute('stroke-width', five ? 5 : 2);
    l.setAttribute('stroke-linecap', 'round');
    ticks.appendChild(l);
  }
  var nums = document.getElementById('nums');
  for (var n = 1; n <= 12; n++) {
    var b = n * 30 * Math.PI / 180, t = document.createElementNS(NS, 'text');
    t.setAttribute('x', C + 128 * Math.sin(b)); t.setAttribute('y', C - 128 * Math.cos(b) + 15);
    t.setAttribute('text-anchor', 'middle'); t.setAttribute('font-size', '44');
    t.textContent = n; nums.appendChild(t);
  }

  /* 바깥 테두리 밖 분 숫자: 5, 10, … 55, 맨 위 60 */
  var mins = document.getElementById('mins');
  for (var q = 1; q <= 12; q++) {
    var c = q * 30 * Math.PI / 180, mt = document.createElementNS(NS, 'text');
    mt.setAttribute('x', C + 218 * Math.sin(c)); mt.setAttribute('y', C - 218 * Math.cos(c) + 10);
    mt.setAttribute('text-anchor', 'middle'); mt.setAttribute('font-size', '28');
    mt.textContent = q * 5; mins.appendChild(mt);
  }

  /* 상태: 12시 0분부터 센 분 (기본 모드) */
  var total = 3 * 60;          // 처음엔 3시
  var live = false, showSec = false, secs = 0;

  function mod(a, m) { return ((a % m) + m) % m; }
  function setRot(el, deg) { el.setAttribute('transform', 'translate(200 200) rotate(' + deg + ')'); }

  var rd = document.getElementById('readout'), rh = document.getElementById('rh'), rm = document.getElementById('rm'), rs = document.getElementById('rs');
  function draw(mins, s) {
    var m720 = mod(mins, 720);
    setRot(hourHand, m720 / 2);
    setRot(minHand, mod(mins, 60) * 6);
    setRot(secHand, (s || 0) * 6);
    var whole = Math.floor(m720 + 1e-6);
    var h = Math.floor(whole / 60), m = whole % 60;
    rh.textContent = (h === 0 ? 12 : h) + '시';
    rm.textContent = m === 0 ? '' : m + '분';
    rs.textContent = (live && showSec) ? Math.floor(s) + '초' : '';
    rd.classList.toggle('wide', live && showSec);
  }

  /* 드래그 */
  var drag = null;
  function svgPoint(e) {
    var p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
    return p.matrixTransform(svg.getScreenCTM().inverse());
  }
  function angleOf(p) { return Math.atan2(p.x - C, -(p.y - C)) * 180 / Math.PI; }
  function distToHand(p, deg, len) {
    var a = deg * Math.PI / 180, tx = Math.sin(a), ty = -Math.cos(a);
    var dx = p.x - C, dy = p.y - C, proj = Math.max(0, Math.min(len, dx * tx + dy * ty));
    return Math.hypot(dx - proj * tx, dy - proj * ty);
  }
  svg.addEventListener('pointerdown', function (e) {
    if (live) return;
    var p = svgPoint(e), r = Math.hypot(p.x - C, p.y - C);
    if (r > 190) return;
    var m720 = mod(total, 720);
    var dh = distToHand(p, m720 / 2, 102), dm = distToHand(p, mod(total, 60) * 6, 152);
    var which = null;
    if (dh < 38 && dm < 38) which = r > 92 ? 'm' : 'h';
    else if (dm < 38) which = 'm';
    else if (dh < 38) which = 'h';
    if (!which) return;
    e.preventDefault();
    svg.setPointerCapture(e.pointerId);
    drag = { which: which, id: e.pointerId, last: angleOf(p), acc: 0, start: total };
    (which === 'h' ? hourHand : minHand).classList.add('grabbed');
  });
  svg.addEventListener('pointermove', function (e) {
    if (!drag || e.pointerId !== drag.id) return;
    var a = angleOf(svgPoint(e)), d = a - drag.last;
    if (d > 180) d -= 360; if (d < -180) d += 360;   // 반시계방향도 자연스럽게
    drag.last = a; drag.acc += d;
    // 분침 1도 = 1/6분, 시침 1도 = 2분 (숫자 한 칸 = 60분 = 분침 한 바퀴)
    var per = drag.which === 'm' ? 1 / 6 : 2;
    total = Math.round(drag.start + drag.acc * per);
    draw(total, 0);
  });
  function endDrag(e) {
    if (!drag || e.pointerId !== drag.id) return;
    hourHand.classList.remove('grabbed'); minHand.classList.remove('grabbed');
    total = mod(total, 720); drag = null;
  }
  svg.addEventListener('pointerup', endDrag);
  svg.addEventListener('pointercancel', endDrag);

  /* 현재 시각 모드 */
  var raf = 0;
  function tick() {
    var d = new Date();
    var s = d.getSeconds();
    draw(d.getHours() * 60 + d.getMinutes() + s / 60, s);
    raf = requestAnimationFrame(tick);
  }

  /* 설정 */
  var optSec = document.getElementById('optSec'), optLive = document.getElementById('optLive'), optBox = document.getElementById('optBox');
  var resetBtn = document.getElementById('reset');
  /* 초침은 현재 시각 모드에서만 (손으로 돌리는 기본 모드에서는 늘 숨김) */
  var secRow = document.getElementById('secRow');
  function applySec() { showSec = optSec.checked; secHand.style.display = (live && showSec) ? '' : 'none'; }
  optSec.addEventListener('change', function () { applySec(); if (!live) draw(total, 0); });
  optLive.addEventListener('change', function () {
    live = optLive.checked; svg.classList.toggle('live', live); resetBtn.disabled = live;
    secRow.hidden = !live; applySec();
    if (live) { tick(); }
    else {
      cancelAnimationFrame(raf);
      var d = new Date(); total = mod(d.getHours() * 60 + d.getMinutes(), 720);
      draw(total, 0);
    }
  });
  var optMin = document.getElementById('optMin');
  optMin.addEventListener('change', function () {
    mins.style.display = optMin.checked ? '' : 'none';
    svg.setAttribute('viewBox', optMin.checked ? '-42 -42 484 484' : '0 0 400 400');
  });
  optBox.addEventListener('change', function () { app.classList.toggle('nobox', !optBox.checked); });
  resetBtn.addEventListener('click', function () { total = 0; draw(total, 0); });

  var panel = document.getElementById('panel'), scrim = document.getElementById('scrim');
  document.getElementById('gear').addEventListener('click', function () { panel.hidden = false; scrim.hidden = false; });
  scrim.addEventListener('click', function () { panel.hidden = true; scrim.hidden = true; });

  /* 우클릭·길게 누르기 메뉴·끌어서 선택 막기 */
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('selectstart', function (e) { e.preventDefault(); });
  document.addEventListener('dragstart', function (e) { e.preventDefault(); });

  applySec();
  draw(total, 0);
})();
</script>
